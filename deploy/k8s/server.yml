apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: gophprofile
spec:
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      serviceAccountName: gophprofile
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: goose
          image: ghcr.io/kukymbr/goose-docker:3.28.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: gophprofile-config
            - secretRef:
                name: gophprofile-secret
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: server
          image: gophprofile-server:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gophprofile-config
            - secretRef:
                name: gophprofile-secret
          env:
            - name: OTEL_SERVICE_NAME
              value: server
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: migrations
          configMap:
            name: gophprofile-migrations

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gophprofile
  namespace: gophprofile
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gophprofile-read-config
  namespace: gophprofile
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gophprofile-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gophprofile-read-config
  namespace: gophprofile
subjects:
  - kind: ServiceAccount
    name: gophprofile
    namespace: gophprofile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gophprofile-read-config

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: gophprofile
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          envFrom:
            - configMapRef:
                name: gophprofile-config
            - secretRef:
                name: gophprofile-secret
          ports: 
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gophprofile
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: gophprofile
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      enableServiceLinks: false
      containers:
        - name: minio
          image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: gophprofile-secret
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: gophprofile
spec:
  selector:
    app: minio
  ports:
    - port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: gophprofile
spec:
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.6-management-alpine
          envFrom:
            - secretRef:
                name: gophprofile-secret
          ports:
            - containerPort: 5672
          readinessProbe:
            tcpSocket:
              port: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: gophprofile
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672

{{- $secretName := .Values.existingSecret -}}
{{- if .Values.secrets -}}
{{- $secretName = printf "%s-secret" .Release.Name -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: "worker"
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: "worker"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: "worker"
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets }}
        checksum/secret: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ printf "%s:%s" .Values.image.worker (default .Chart.AppVersion .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ required "set existingSecret or provide secrets" $secretName | quote }}
          env:
            - name: OTEL_SERVICE_NAME
              value: worker
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}

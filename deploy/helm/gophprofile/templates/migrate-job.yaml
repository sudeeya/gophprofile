{{- $name := printf "%s-migrate" .Release.Name -}}
{{- $secretName := .Values.existingSecret -}}
{{- $annotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" -}}
{{- if .Values.secrets -}}
{{- $secretName = printf "%s-credentials" $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
    helm.sh/hook-weight: "-10"
type: Opaque
data:
  GOOSE_DBSTRING: {{ required "set secrets.GOOSE_DBSTRING" .Values.secrets.GOOSE_DBSTRING | toString | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
    helm.sh/hook-weight: "-10"
automountServiceAccountToken: false
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
    helm.sh/hook-weight: "-10"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: "migrate"
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- list .Values.networkPolicy.dns .Values.networkPolicy.dependencies.postgres | toYaml | nindent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: "migrate"
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goose
          image: {{ printf "%s:%s" .Values.image.migrate (default .Chart.AppVersion .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: {{ required "set existingSecret or provide secrets" $secretName | quote }}
                  key: GOOSE_DBSTRING

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: "server"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: "server"
  ports:
    - name: http
      port: 80
      targetPort: http

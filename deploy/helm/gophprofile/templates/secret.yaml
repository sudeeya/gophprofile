{{- if .Values.secrets }}
{{- range $key := list "POSTGRES_USER" "POSTGRES_PASSWORD" "GOOSE_DBSTRING" "MINIO_ROOT_USER" "MINIO_ROOT_PASSWORD" "RABBITMQ_DEFAULT_USER" "RABBITMQ_DEFAULT_PASS" }}
{{- $_ := required (printf "set secrets.%s" $key) (index $.Values.secrets $key) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" .Release.Name | quote }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}

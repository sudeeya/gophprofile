services:
  postgres:
    container_name: postgres
    image: postgres:18.6-alpine3.24
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  goose:
    container_name: goose
    image: ghcr.io/kukymbr/goose-docker:3.28.0
    env_file: .env
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    container_name: minio
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    env_file: .env
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.3.6-management-alpine
    env_file: .env
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.76.0
    restart: always
    ports:
      - "14269:14269"
      - "16686:16686"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:14269" ]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.161.0
    env_file: .env
    restart: always
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yaml
    ports:
      - "13133:13133"
    depends_on:
      jaeger:
        condition: service_healthy

  server:
    container_name: server
    build:
      dockerfile: Dockerfile.server
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: server
    ports:
      - "8080:${SERVER_PORT}"
    depends_on:
      postgres: 
        condition: service_healthy
      goose:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  worker:
    container_name: worker
    build:
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: worker
    depends_on:
      postgres: 
        condition: service_healthy
      goose:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  minio_data:
  rabbitmq_data:
